<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste BPA local</title>
<!-- Etapa 0 da integração do BPA: o navegador deixa uma página do servidor
     (192.168.1.29:8001) falar com o BPA do próprio notebook (localhost:8503)?
     Página temporária -- sai quando a integração estiver pronta. -->
<style>
  :root { --fundo:#f1f5f9; --cartao:#fff; --borda:#e2e8f0; --texto:#0f172a; --texto2:#475569; --azul:#2563eb; --ok:#15803d; --erro:#b91c1c; }
  body { margin:0; background:var(--fundo); color:var(--texto); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:640px; margin:40px auto; padding:0 16px; }
  .cartao { background:var(--cartao); border:1px solid var(--borda); border-radius:14px; padding:22px 24px; }
  h1 { font-size:20px; margin:0 0 6px; }
  p { color:var(--texto2); font-size:14px; line-height:1.5; }
  button { background:var(--azul); color:#fff; border:0; border-radius:8px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  ol { padding-left:20px; font-size:14px; }
  li { margin:8px 0; }
  .ok { color:var(--ok); font-weight:600; }
  .erro { color:var(--erro); font-weight:600; }
  code { background:var(--fundo); padding:1px 5px; border-radius:4px; }
  #info { font-size:12.5px; color:var(--texto2); margin-top:16px; word-break:break-all; }
</style>
</head>
<body>
<main>
  <div class="cartao">
    <h1>Teste: sistema ↔ BPA deste notebook</h1>
    <p>Abra esta página <strong>num notebook do BPA, com o BPA ligado</strong> (atalho do robozinho).
       Se o navegador perguntar se o site pode acessar dispositivos/apps da rede local, clique em <strong>Permitir</strong>.</p>
    <button id="btn">Testar</button>
    <ol id="res"></ol>
    <div id="info"></div>
  </div>
</main>
<script>
const alvo = "http://localhost:8503/";
const res = document.getElementById("res");
function linha(txt, cls) { const li = document.createElement("li"); li.innerHTML = txt; if (cls) li.className = cls; res.appendChild(li); }
document.getElementById("info").textContent =
  "Página: " + location.origin + " · Navegador: " + navigator.userAgent;

document.getElementById("btn").onclick = async (e) => {
  e.target.disabled = true; res.innerHTML = "";
  // 1) O navegador deixa a requisição sair? (no-cors: não lê a resposta,
  //    só descobre se foi bloqueada. Não depende do BPA estar preparado.)
  try {
    await fetch(alvo, { mode: "no-cors", cache: "no-store" });
    linha("✔ O navegador <strong>permitiu</strong> esta página falar com o BPA local.", "ok");
  } catch (err) {
    linha("✘ O navegador <strong>bloqueou</strong> (ou o BPA está desligado): <code>" + err + "</code>", "erro");
    linha("Confira se o BPA está aberto em outra aba em <code>" + alvo + "</code>. Se estiver e mesmo assim falhou, o bloqueio é do navegador.");
    e.target.disabled = false; return;
  }
  // 2) Consegue LER a resposta? Hoje é esperado falhar: o BPA antigo ainda não
  //    autoriza o sistema (isso é feito na etapa 1). Só registra o resultado.
  try {
    const r = await fetch(alvo + "api/lotes", { cache: "no-store" });
    linha("✔ Leu a resposta do BPA (HTTP " + r.status + ") — já está liberado por completo.", "ok");
  } catch (err) {
    linha("• Leitura da resposta ainda não liberada (esperado por enquanto — o BPA será preparado na etapa 1).");
  }
  e.target.disabled = false;
};
</script>
</body>
</html>
