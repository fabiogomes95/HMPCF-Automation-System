name: Build HMPCF.exe

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      existing_tag:
        description: "Tag da release existente (ex: v1.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup MSYS2 and install GTK3
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gtk3

      - name: Add GTK3 DLLs to PATH
        shell: pwsh
        run: echo "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build HMPCF_Recepcao.exe
        run: pyinstaller recepcao.spec --onefile

      - name: Build HMPCF_Painel.exe
        run: pyinstaller painel.spec --onefile

      - name: Upload .exe to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.existing_tag || github.event.release.tag_name }}
          files: |
            dist/HMPCF_Recepcao.exe
            dist/HMPCF_Painel.exe
