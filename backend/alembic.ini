# Alembic: versões do esquema do banco (tabelas/colunas). Rodar da pasta backend:
#   .venv\Scripts\python -m alembic upgrade head      aplica o que faltar
#   .venv\Scripts\python -m alembic revision --autogenerate -m "descricao"
# A conexão vem do backend/.env (app.core.config), não daqui.
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = America/Sao_Paulo

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
