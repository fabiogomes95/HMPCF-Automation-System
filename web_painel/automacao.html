<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Módulo Automação - HMPCF</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="text/javascript" src="/eel.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
    <a href="index.html" class="top-back-link">⬅️ Início</a>
    <h4>🏥 MÓDULO DE AUTOMAÇÃO BPA</h4>
</div>

<div class="container py-4">
    
    <div class="row g-4 mb-5 justify-content-center">
        <div class="col-md-4">
            <a href="digitacao.html" class="module-card module-card--pad">
                <div class="module-icon module-icon--lg">✍️</div>
                <h5>Digitação Médicos</h5>
            </a>
        </div>
        <div class="col-md-4">
            <a href="triagem.html" class="module-card module-card--pad">
                <div class="module-icon module-icon--lg">🩺</div>
                <h5>Triagem Enfermeiros</h5>
            </a>
        </div>
        <div class="col-md-4">
            <a href="robo.html" class="module-card module-card--pad">
                <div class="module-icon module-icon--lg">🚀</div>
                <h5>Execução Robô</h5>
            </a>
        </div>
    </div>

    <div class="editor-container shadow-sm editor-container--wide rounded-top-border">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="fw-bold badge-primary">🔍 Verificação de Lote (.txt):</span>
            <select id="combo_producao" class="form-select w-50" onchange="carregarProducaoSelecionada()"></select>
        </div>
        <textarea id="texto_lote" class="form-control" rows="15" readonly placeholder="Selecione um arquivo acima para acompanhar o conteúdo..."></textarea>
    </div>
</div>

<script>
    window.onload = async () => { await carregarListaArquivos(); };

    async function carregarListaArquivos() {
        let arqs = await eel.listar_producoes()();
        let combo = document.getElementById('combo_producao');
        combo.innerHTML = '<option value="">Selecione um lote para conferir...</option>';
        arqs.forEach(a => { 
            let opt = document.createElement('option'); 
            opt.value = opt.innerText = a; 
            combo.appendChild(opt); 
        });
    }

    async function carregarProducaoSelecionada() {
        let combo = document.getElementById('combo_producao');
        if(!combo.value) {
            document.getElementById('texto_lote').value = "";
            return;
        }
        let texto = await eel.ler_producao(combo.value)();
        document.getElementById('texto_lote').value = texto;
    }
</script>
</body>
</html>
