<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Assistente de Digitação - HMPCF</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="/eel.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .search-container { background: white; border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); }
        .result-item {
            background: #fff; border-left: 5px solid var(--primary-blue);
            padding: 12px; margin-bottom: 8px; border-radius: 6px;
            cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between;
        }
        .result-item:hover { transform: translateX(5px); border-left-color: var(--extremoz-yellow); background: #f0f4f8; }
        .doc-tag { font-size: 0.8rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; background: #e9ecef; }
    </style>
</head>
<body>

<div class="topbar">
    <a href="automacao.html" style="position: absolute; left: 30px; color: white; text-decoration: none; font-weight: 600;">⬅️ Voltar</a>
    <h4>🏥 HMPCF - ASSISTENTE DE DIGITAÇÃO</h4>
</div>

<div class="container py-4">
    <div class="card p-3 mb-4 shadow-sm border-0">
        <div class="row g-3">
            <div class="col-md-5">
                <label class="form-label fw-bold">Profissional / Sala</label>
                <input type="text" id="med_atual" class="form-control" placeholder="EX: ENF JANAINA" style="text-transform: uppercase;">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold">Data do Lote</label>
                <input type="text" id="data_atual" class="form-control" placeholder="DDMMYYYY" maxlength="8">
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <button class="btn btn-primary w-100 fw-bold" onclick="iniciarSessao()">INICIAR PRODUÇÃO</button>
            </div>
        </div>
    </div>

    <div id="area_busca" class="d-none">
        <div class="alert alert-info py-2 mb-3 fw-bold" id="status_sessao"></div>
        <div class="search-container mb-3">
            <input type="text" id="input_busca" class="form-control form-control-lg" placeholder="🔍 Digite o Nome, SUS ou CPF do paciente...">
        </div>
        <div id="lista_resultados" class="d-flex flex-column" tabindex="-1"></div>
    </div>
</div>

<script>
    let arquivoProducao = "";

    async function iniciarSessao() {
        let med = document.getElementById('med_atual').value.trim().toUpperCase();
        let dt = document.getElementById('data_atual').value.trim();
        if(!med || !dt) return alert("Preencha profissional e data!");

        arquivoProducao = `PRODUCAO_${dt}.txt`;
        let ok = await eel.registrar_cabecalho_digitacao(arquivoProducao, med, dt)();
        if(ok) {
            document.getElementById('status_sessao').innerText = `👨‍⚕️ ${med} | 📅 ${dt} (Gravando em: ${arquivoProducao})`;
            document.getElementById('area_busca').classList.remove('d-none');
            document.getElementById('input_busca').focus();
            buscarPacientes(""); // Traz os primeiros 50
        }
    }

    // =========================================================
    // 🎭 MÁSCARA CAMALEÃO (Ao digitar CPF e SUS)
    // =========================================================
    document.getElementById('input_busca').addEventListener('input', function(e) {
        let valor = this.value;
        if (/[A-Za-zÀ-ÿ]/.test(valor)) {
            buscarPacientes(valor);
            return;
        }

        let num = valor.replace(/\D/g, '').substring(0, 15);
        let formatado = '';

        if (num.length <= 11) {
            formatado = num.replace(/(\d{3})(\d)/, '$1.$2')
                           .replace(/(\d{3})(\d)/, '$1.$2')
                           .replace(/(\d{3})(\d{1,2})/, '$1-$2');
        } else {
            formatado = num.replace(/(\d{3})(\d)/, '$1 $2')
                           .replace(/(\d{4})(\d)/, '$1 $2')
                           .replace(/(\d{4})(\d{1,4})/, '$1 $2');
        }
        this.value = formatado;
        buscarPacientes(formatado); // Busca usando o número mascarado (o Python limpa por trás)
    });

    async function buscarPacientes(termo) {
        let resultados = await eel.buscar_pacientes_fb(termo)();
        let div = document.getElementById('lista_resultados');
        div.innerHTML = "";

        resultados.forEach(p => {
            let item = document.createElement('div');
            item.className = 'result-item';
            // A prioridade oficial: Se não tem SUS, exibe e usa o CPF.
            let doc_exibir = p.sus ? `<span class="doc-tag text-primary">💳 SUS: ${p.sus}</span>` 
                                   : `<span class="doc-tag text-secondary">CPF: ${p.cpf}</span>`;
            let doc_valor = p.sus || p.cpf;

            item.tabIndex = 0; // Torna o item focável pelo teclado
            item.innerHTML = `
                <div><span class="fw-bold">${p.nome}</span> <small class="text-muted ms-2">🎂 ${p.dtnasc}</small></div>
                <div>${doc_exibir}</div>
            `;
            
            // Quando clica ou aperta ENTER:
            item.onclick = async () => {
                if(!doc_valor) return alert("Paciente sem documento válido!");
                let ok = await eel.adicionar_paciente_txt(arquivoProducao, doc_valor)();
                if(ok) {
                    let input = document.getElementById('input_busca');
                    input.value = ""; // Limpa a caixa pra próxima busca
                    input.placeholder = `✅ ${p.nome} GRAVADO! Próximo...`;
                    input.focus();
                    buscarPacientes(""); // Reseta a lista
                }
            };
            div.appendChild(item);
        });
    }

    // =========================================================
    // ⌨️ NAVEGAÇÃO DE TECLADO (O SEGREDO DA VELOCIDADE)
    // =========================================================
    document.getElementById("input_busca").addEventListener("keydown", function(e) {
        if (e.key === "Tab" || e.key === "ArrowDown") {
            e.preventDefault(); 
            let primeiroPaciente = document.querySelector(".result-item");
            if (primeiroPaciente) primeiroPaciente.focus(); 
        }
    });

    document.getElementById("lista_resultados").addEventListener("keydown", function(e) {
        let selecionado = document.activeElement;
        
        if (selecionado && selecionado.classList.contains("result-item")) {
            if (e.key === "Tab" || e.key === "ArrowDown") {
                e.preventDefault();
                let proximo = selecionado.nextElementSibling;
                if (proximo) proximo.focus();
            }
            else if (e.key === "ArrowUp") {
                e.preventDefault();
                let anterior = selecionado.previousElementSibling;
                if (anterior) anterior.focus();
                else document.getElementById("input_busca").focus();
            }
            else if (e.key === "Enter") {
                e.preventDefault();
                selecionado.click(); 
            }
        }
    });
</script>
</body>
</html>
